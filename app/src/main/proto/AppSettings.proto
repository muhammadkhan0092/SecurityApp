syntax = "proto3";

import "google/protobuf/wrappers.proto";

option java_package = "com.example.securityapp.datastore";
option java_multiple_files = true;

message AppSettings {
    enum UserType {
        not_set = 0;
        controller = 1;
        controlled =2;
    }
    string email = 1;
    bool isSetupComplete = 2;
    string barcode = 3;
    UserType userType = 4;
    bool shouldBlock = 5;
}
